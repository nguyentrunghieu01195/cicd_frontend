name: Build and publish to Laravel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-frontend-to-backend
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and build
        run: |
          npm ci
          npm run build
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.BACKEND_REPOSITORY }}
          ref: main
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: backend
      - name: Copy build into Laravel
        run: |
          mkdir -p backend/public/assets backend/resources/views
          rsync -a --delete dist/assets/ backend/public/assets/
          cp dist/index.html backend/resources/views/app.blade.php
      - name: Commit and push backend
        working-directory: backend
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No frontend changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets resources/views/app.blade.php
          git commit -m "chore(frontend): publish ${SOURCE_SHA::7}"
          git push origin main
